</style></head><body>
<canvas id="g"></canvas><div id="pg"><i id="pgi"></i></div>
<div id="hud"><span id="hr"></span><span id="hl"></span><span id="hc"></span><span id="hs"></span></div>

<script>
const $=id=>document.getElementById(id),cv=$('g'),cx=cv.getContext('2d');
let W,H,R,HZ,YB,cam=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);R=W<700?W*.44:Math.min(W*.3,H*.62);HZ=H*.36;YB=H*.9}
addEventListener('resize',rs);rs();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function gauss(){let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*Math.random())}
let AC;function beep(f,d=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.type='square';g.gain.value=.03;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function ov(h){const e=$('ov');if(h==null){e.style.display='none';e.innerHTML=''}else{e.innerHTML=h;e.style.display='flex'}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}
let ft;function fbk(ok,q,extra){const e=$('fbk');e.style.borderColor=ok?'#3ddc97':'#ff5d73';e.innerHTML=`<b>${ok?'✅ Correct! +200 points':'❌ Wrong lane'}</b>${extra||''}<br>Answer: <b>${q.o[q.ans]}</b><br><span class="mut">${q.why}</span>`;e.style.opacity=1;clearTimeout(ft);ft=setTimeout(()=>e.style.opacity=0,7000)}
const LX=[-.62,0,.62],CON=['Overfitting','Sampling','Causation'],nl=x=>x<-.31?0:x>.31?2:1;
let S={mode:'menu',pz:0,px:0,tl:0,lane:1,lives:3,coins:0,score:0,gate:0,gz:0,objs:[],ci:0,invul:0,shake:0,res:{},qd:null,plan:[],si:0,cl:0,cp:0,jy:0,vy:0,spd:17,t:0,za:0,paused:0,zin:0},LOG=[];
try{LOG=JSON.parse(localStorage.getItem('ddlog')||'[]')}catch(e){}
let HIST=[],NAME='Player';try{HIST=JSON.parse(localStorage.getItem('ddhist')||'[]');NAME=localStorage.getItem('ddname')||'Player'}catch(e){}
function setName(v){NAME=v.trim().slice(0,20)||'Player';try{localStorage.setItem('ddname',NAME)}catch(e){}}
function saveHist(win){HIST.push({d:new Date().toLocaleString(),n:esc(NAME),w:win?1:0,s:S.score,c:S.coins,a:S.acc,o:['Overfitting','Sampling','Causation'].map(k=>[S.res[k].filter(x=>x).length,S.res[k].length])});if(HIST.length>100)HIST.shift();try{localStorage.setItem('ddhist',JSON.stringify(HIST))}catch(e){}}
function histHTML(){const n=HIST.length;if(!n)return '<p class="mut">No games saved yet — finish a run (win or lose) and it appears here.</p>';const w=HIST.filter(x=>x.w).length,best=Math.max(...HIST.map(x=>x.s)),av=Math.round(HIST.reduce((a,x)=>a+x.a,0)/n);
const bars=['🧠 Overfitting','🎲 Sampling','☀️ Causation'].map((t,i)=>{const c=HIST.reduce((a,x)=>a+x.o[i][0],0),q=HIST.reduce((a,x)=>a+x.o[i][1],0),p=q?Math.round(100*c/q):0;return `<div style="margin:4px 0">${t}: <b>${p}%</b> (${c}/${q})<div style="background:#0d1232;border-radius:6px;height:10px"><div style="width:${p}%;height:10px;border-radius:6px;background:linear-gradient(90deg,#3ddc97,#ffd23f)"></div></div></div>`}).join('');
return `<p>Games <b>${n}</b> · Wins <b>${w}</b> · Best score <b>${best}</b> · Avg accuracy <b>${av}%</b></p>${bars}<table><tr><th>When</th><th>Player</th><th>Result</th><th>Score</th><th>Coins</th><th>Quiz %</th></tr>${HIST.slice(-10).reverse().map(x=>`<tr><td>${x.d}</td><td>${x.n}</td><td>${x.w?'🏆 Win':'💀 Lost'}</td><td>${x.s}</td><td>${x.c}</td><td>${x.a}%</td></tr>`).join('')}</table>`}
function showHist(){ov(`<div class="panel"><h2>📈 My history</h2><p class="mut">Saved on this device after every game.</p>${histHTML()}<button class="b" onclick="menu()">Back</button><button class="b s" onclick="HIST=[];try{localStorage.removeItem('ddhist')}catch(e){}showHist()">Clear history</button></div>`)}
const STARS=Array.from({length:70},()=>[Math.random(),Math.random(),Math.random()*.8+.2]),MT=Array.from({length:15},()=>.4+Math.random()*.9),CL=Array.from({length:6},(_,i)=>({x:i/6,y:.05+Math.random()*.18,s:.6+Math.random()*.8})),BD=[0,1,2,3].map(i=>({x:i*.3,y:Math.random()*.4}));
/* ---------- simple theory questions ---------- */
const QB={
Overfitting:[
{q:'What is overfitting?',o:['A model that memorises its training examples, even the noise','A model that is too simple to learn anything','A model that runs too slowly'],why:'Like a student who memorises old exam answers: great on the old paper, bad on a new one.'},
{q:'How do we check if a model is overfitting?',o:['Test it on new data it has never seen','Look only at the data it studied','Make the model more complicated'],why:'A good model must work on NEW data, not just the examples it already saw.'},
{q:'A model is perfect on its training examples but fails on new ones. This is called…',o:['Overfitting','Underfitting','A perfect model'],why:'Perfect on old examples + bad on new ones = memorising, not learning.'},
{q:'Which model is most likely to overfit?',o:['One that is far too complicated for the amount of data','One that is very simple','One that has seen lots of varied data'],why:'A very flexible model can bend to fit every bit of noise.'},
{q:'What is “test data” used for?',o:['To check the model on examples it never studied','To teach the model more','To help the model memorise'],why:'Test data is kept hidden so it shows how the model handles new situations.'},
{q:'A line that is too simple and misses the pattern is called…',o:['Underfitting','Overfitting','Sampling'],why:'Too simple = misses the pattern (underfitting). Too complicated = memorises noise (overfitting).'}],
Sampling:[
{q:'What is the fairest way to choose a sample?',o:['Pick people at random','Ask only people who are easy to reach','Ask only people who agree with you'],why:'Random picking gives everyone an equal chance, so the sample looks like the whole group.'},
{q:'Why is asking only a basketball club about height a bad idea?',o:['It is biased: they are not like everyone','It is too random','It is too fair'],why:'That unfair picking is called bias. A bigger sample of the same group does not cure it.'},
{q:'What is a “sample”?',o:['A small part of a group used to learn about the whole group','The whole group','A wrong answer'],why:'We usually can’t ask everyone, so we ask a sample and guess about everybody.'},
{q:'What does a bigger random sample usually give you?',o:['Less luck, so more reliable guesses','A guaranteed perfect answer','More bias'],why:'More fair samples mean the guesses wobble less.'},
{q:'A survey is posted only on a gaming website. What is the problem?',o:['Only gamers answer, so it may be biased','Too many people answer','It is perfectly fair'],why:'Only one kind of person sees it, so the result may not match everyone.'},
{q:'What do we call unfair picking that gives a wrong picture?',o:['Bias','Fitting','Correlation'],why:'Bias pushes the answer in one direction, away from the truth.'}],
Causation:[
{q:'Ice-cream sales and drownings rise together. What is the likely reason?',o:['Hot weather causes both','Ice cream makes people drown','Drowning makes people buy ice cream'],why:'Heat is the hidden third factor (a confounder) behind both.'},
{q:'“Correlation” means…',o:['Two things move together — it does not prove one causes the other','One thing definitely causes the other','The data must be wrong'],why:'Moving together is only a clue. Proving a cause needs more evidence.'},
{q:'What is a “confounder”?',o:['A hidden factor that affects both things','A mistake in the data','A very big number'],why:'Like the heat that drives both ice-cream sales and swimming.'},
{q:'People who sleep with shoes on often wake with headaches. Most likely reason?',o:['Drinking the night before causes both','Shoes cause headaches','Headaches make people keep shoes on'],why:'A hidden cause (a late night) explains both. Together does not mean because.'},
{q:'What can best show that A really causes B?',o:['A fair experiment where only A is changed','Seeing A and B rise together','A strong feeling'],why:'Changing only A while keeping everything else the same shows its real effect.'},
{q:'A correlation score r close to 0 means…',o:['No clear link between the two things','A very strong link','The data is perfect'],why:'Near 1 = strong link, near 0 = no link.'}]};
const TOP=['Overfitting','Sampling','Causation'];
function pick(){let seen={};try{seen=JSON.parse(localStorage.getItem('ddseen')||'{}')}catch(e){}const out={};
TOP.forEach(t=>{let sn=seen[t]||[],pool=QB[t].map((_,i)=>i).filter(i=>!sn.includes(i));if(pool.length<2){sn=[];pool=QB[t].map((_,i)=>i)}pool.sort(()=>Math.random()-.5);const ch=pool.slice(0,2);seen[t]=sn.concat(ch);out[t]=ch.map(i=>({...QB[t][i],c:t}))});
try{localStorage.setItem('ddseen',JSON.stringify(seen))}catch(e){}return out}
/* ---------- plan & world ---------- */
const SEG={gate:230,lab:150,q:300};
function mkPlan(){const p=[],Q=pick();let g=0,n=0;p.push({t:'gate',n:++g},{t:'gate',n:++g},{t:'gate',n:++g});
TOP.forEach((t,l)=>{p.push({t:'lab',l},{t:'q',l,q:Q[t][0],n:++n},{t:'q',l,q:Q[t][1],n:++n,g:++g,fin:l===2?1:0})});return p}
function shuf(q){const i=[0,1,2].sort(()=>Math.random()-.5);return{q:q.q,o:i.map(k=>q.o[k]),ans:i.indexOf(0),why:q.why,c:q.c}}
function gen(sg){const s=S.segStart,e=S.gz,lvl=Math.min(.9,.4+S.si*.03),free=sg.t==='q'?e-135:e-20,ob=[],cn=[];
for(let z=s+30;z<free;z+=13)if(Math.random()<lvl){const x=Math.random()*1.6-.8;ob.push({t:'o',z,x,w:.32});if(Math.random()<S.si*.025)ob.push({t:'o',z,x:x>0?x-.9:x+.9,w:.32})}
for(let z=s+15;z<free;z+=3){const x=.7*Math.sin(z/19);if(!ob.some(b=>Math.abs(b.z-z)<3&&Math.abs(b.x-x)<.4))cn.push({t:'c',z,x})}
if(sg.t==='q')for(let z=e-125;z<e-8;z+=10)LX.forEach(x=>cn.push({t:'c',z,x}));
S.objs=S.objs.concat(ob,cn).sort((a,b)=>a.z-b.z);S.ci=0}
function startSeg(){const sg=S.plan[S.si];if(sg.l!=null)S.cl=sg.l;S.segStart=S.pz;S.gz=S.pz+SEG[sg.t];S.cp=S.pz;S.warn=0;S.lives=3;S.zin=0;S.qd=sg.t==='q'?shuf(sg.q):null;gen(sg)}
function nextSeg(){S.si++;startSeg()}
function startGame(){ov(null);const p=mkPlan();Object.assign(S,{mode:'run',plan:p,si:0,total:p.reduce((a,s)=>a+SEG[s.t],0),pz:0,px:0,lane:1,lives:3,coins:0,score:0,gate:0,ll:2,objs:[],jy:0,vy:0,spd:17,paused:0,res:{Overfitting:[],Sampling:[],Causation:[]}});startSeg()}
function reach(){const sg=S.plan[S.si];
if(sg.t==='gate'){S.gate++;S.coins+=20;S.score+=20;beep(660,.2);if(sg.fin)return endGame(1);toast(`Gate ${sg.n}/6 ✔  +20`);nextSeg()}
else if(sg.t==='lab'){S.mode='lab';[lab1,lab2,lab3][sg.l]()}
else{const q=S.qd,ok=S.lane===q.ans;S.res[q.c].push(ok);if(ok){S.score+=200;S.coins+=25;beep(880,.25)}else{S.ll--;beep(180,.3)}fbk(ok,q,ok?'':` — 🛟 ${Math.max(0,S.ll)} lifeline${S.ll===1?'':'s'} left`);if(S.ll<=0){S.mode='over';setTimeout(()=>endGame(0),2200);return}if(sg.g){S.gate++;S.coins+=20;S.score+=20}if(sg.fin){S.mode='over';setTimeout(()=>endGame(1),2600);return}nextSeg()}}
function go(){ov(null);S.mode='run';nextSeg()}
function crash(){toast('💥 Crashed! Back to the start of this stretch');S.pz=S.cp;S.lives=3;S.ci=0;S.zin=0;S.score=Math.max(0,S.score-50)}
function upd(dt){S.invul=Math.max(0,S.invul-dt);S.shake=Math.max(0,S.shake-dt);S.t+=dt;
if(S.mode==='menu'){S.pz+=9*dt;if(S.pz>2000)S.pz=0;S.px=Math.sin(S.pz/12)*.5;return}
if(S.mode!=='run'||S.paused)return;
const sg=S.plan[S.si],d=S.gz-S.pz,zone=sg.t==='q'&&d<130;S.za=sg.t==='q'?clamp((130-d)/15,0,1):0;
S.spd+=((zone?11:Math.min(24,17+S.si*.6))-S.spd)*Math.min(1,dt*2);S.pz+=S.spd*dt;
if(S.jy>0||S.vy>0){S.vy-=9*dt;S.jy+=S.vy*dt;if(S.jy<=0){S.jy=0;S.vy=0}}
const old=S.px;
if(zone){if(!S.zin){S.zin=1;S.lane=nl(S.px);toast('Pick a lane — take your time!')}S.px+=(LX[S.lane]-S.px)*Math.min(1,dt*10)}else{S.zin=0;S.px=clamp(S.px+((K.r||0)-(K.l||0))*1.7*dt,-.9,.9)}
S.tl+=(clamp((S.px-old)/Math.max(dt,.001)*.18,-.3,.3)-S.tl)*Math.min(1,dt*10);
if(sg.t==='lab'&&!S.warn&&d<110){S.warn=1;toast('🔬 Lab ahead — learn something new!')}
const o=S.objs;while(S.ci<o.length&&o[S.ci].z<S.pz-3)S.ci++;
for(let j=S.ci;j<o.length&&o[j].z<S.pz+1.5;j++){const b=o[j];if(b.hit)continue;const dz=b.z-S.pz;
if(b.t==='c'){if(Math.abs(dz)<1&&Math.abs(b.x-S.px)<.2&&S.jy<.6){b.hit=1;S.coins++;S.score+=10;beep(1200,.04)}}
else if(S.invul<=0&&S.jy<.42&&Math.abs(dz)<.9&&Math.abs(b.x-S.px)<b.w/2+.1){S.lives--;S.invul=1.6;S.shake=.4;beep(120,.2);if(S.lives<=0)crash()}}
if(S.pz>=S.gz)reach()}
/* ---------- input ---------- */
const K={};function mv(d){S.lane=clamp(S.lane+d,0,2);beep(500,.03)}
function jump(){if(S.mode==='run'&&!S.paused&&S.jy===0){S.vy=3.7;S.jy=.001;beep(700,.05)}}
function togglePause(){if(S.mode!=='run')return;if(S.paused){S.paused=0;ov(null)}else{S.paused=1;ov(`<div class="panel" style="width:min(380px,92vw);text-align:center"><h2>⏸ Paused</h2><button class="b" onclick="togglePause()">▶ Resume</button><br><button class="b s" onclick="startGame()">↺ Restart</button><br><button class="b s" onclick="S.paused=0;menu()">🏠 Main menu</button></div>`)}}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowLeft','a','A'].includes(k)){K.l=1;if(S.zin&&S.mode==='run'&&!S.paused)mv(-1)}if(['ArrowRight','d','D'].includes(k)){K.r=1;if(S.zin&&S.mode==='run'&&!S.paused)mv(1)}if([' ','ArrowUp','w','W'].includes(k)){jump();e.preventDefault()}if(k==='p'||k==='P'||k==='Escape')togglePause();if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))K.l=0;if(['ArrowRight','d','D'].includes(e.key))K.r=0});
let pd=null;cv.addEventListener('pointerdown',e=>pd={x:e.clientX,y:e.clientY,l:e.clientX});
cv.addEventListener('pointermove',e=>{if(!pd||S.mode!=='run'||S.paused)return;if(!S.zin)S.px=clamp(S.px+(e.clientX-pd.l)/R*1.3,-.9,.9);pd.l=e.clientX});
cv.addEventListener('pointerup',e=>{if(pd&&S.mode==='run'&&!S.paused){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(dy<-40&&-dy>Math.abs(dx))jump();else if(S.zin)mv(Math.abs(dx)>30?(dx>0?1:-1):(e.clientX>W/2?1:-1))}pd=null});
/* ---------- rendering ---------- */

function fit(Pt,d){const n=d+1,A=[];for(let i=0;i<n;i++)A.push(new Array(n+1).fill(0));
for(const[x,y]of Pt){const pw=[1];for(let k=1;k<2*n;k++)pw.push(pw[k-1]*x);for(let i=0;i<n;i++){for(let j=0;j<n;j++)A[i][j]+=pw[i+j];A[i][n]+=y*pw[i]}}
for(let i=0;i<n;i++)A[i][i]+=1e-9;
for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<=n;c++)A[r][c]-=f*A[i][c]}}
const c=new Array(n);for(let i=n-1;i>=0;i--){let s=A[i][n];for(let j=i+1;j<n;j++)s-=A[i][j]*c[j];c[i]=s/A[i][i]}return c}
const pv=(c,x)=>c.reduce((s,v,i)=>s+v*Math.pow(x,i),0),mse=(c,Pt)=>Pt.reduce((s,[x,y])=>s+(pv(c,x)-y)**2,0)/Pt.length,f1=x=>.8*Math.sin(2.2*x);
function cor(a,b){const n=a.length,ma=a.reduce((s,v)=>s+v)/n,mb=b.reduce((s,v)=>s+v)/n;let x=0,y=0,z=0;for(let i=0;i<n;i++){const p=a[i]-ma,q=b[i]-mb;x+=p*q;y+=p*p;z+=q*q}return x/Math.sqrt(y*z)}

function stats(m,n,k=60){const e=[];for(let i=0;i<k;i++)e.push(smp(m,n));const mu=e.reduce((a,b)=>a+b)/k;return{e,mu,sd:Math.sqrt(e.reduce((a,b)=>a+(b-mu)**2,0)/k)}}
function l2draw(){const L=LS2,n=NS[L.ni],s=stats(L.m,n);L.ms.add(L.m);const g=$('lc').getContext('2d'),B=40,lo=155,hi=195,bw=520/B,cnt=new Array(B).fill(0);s.e.forEach(v=>{const i=Math.floor((v-lo)/(hi-lo)*B);if(i>=0&&i<B)cnt[i]++});
g.fillStyle='#0d1232';g.fillRect(0,0,560,300);g.fillStyle=L.m==='r'?'#00e5ff':'#ff9f43';cnt.forEach((c,i)=>g.fillRect(20+i*bw,270-c*(250/40),bw-1,c*(250/40)));
const tx=20+(L.tm-lo)/(hi-lo)*520;g.strokeStyle='#fff';g.setLineDash([5,4]);g.beginPath();g.moveTo(tx,10);g.lineTo(tx,270);g.stroke();g.setLineDash([]);g.fillStyle='#9aa6d6';g.font='12px system-ui';g.fillText('real average',tx+5,22);for(let v=155;v<=195;v+=10)g.fillText(v+' cm',20+(v-lo)/(hi-lo)*520-12,290);
$('ro').innerHTML=`Average of the guesses: <b>${s.mu.toFixed(1)} cm</b> · real average: <b>${L.tm.toFixed(1)} cm</b>`;
$('ins').textContent=L.m==='c'?(n>=100?'The guesses are tightly packed but far from the white line. More people from the same group does NOT fix bias!':'These guesses come from tall people only, so they are shifted away from the truth (bias).'):(n>=100?'Fair + big sample: guesses cluster tightly around the real answer.':'Small sample: fair on average, but each guess is a lottery (wide spread).');
mis('Draw once with each method',L.ms.size>=2)}
function lab3(){const T=[],A=[],D=[];for(let i=0;i<120;i++){const t=28+6*gauss();T.push(t);A.push(8*t+25*gauss());D.push(.12*t+.5*gauss())}
const mn=Math.min(...T),mx=Math.max(...T);LS3={T,A,D,mn,mx,lo:null,col:0,mv:new Set(),r:cor(A,D)};
shell('🔗 Lab 3 · Correlation vs Causation — together ≠ because','<b>🧒 In plain words:</b> <b>Correlation</b> means two things rise and fall together. But together doesn’t mean “because”! On hot days people buy more ice cream <i>and</i> swim more (so more accidents). The <b>heat</b> is the hidden cause of both. Each dot = one summer day. <b>r</b> is a score: near 1 = strong link, near 0 = no link.','👉 Tick “colour by temperature”, then slide the window to look at days with similar heat. Watch r!','<canvas id="lc" class="lab" width="560" height="300"></canvas>',`<label><input type="checkbox" onchange="LS3.col=this.checked?1:LS3.col;l3()"> Colour days by temperature (blue = cool, red = hot)</label><br><label>Only look at days from <b id="tv">–</b> °C (3° window)</label><input type="range" min="${Math.floor(mn)}" max="${Math.ceil(mx-3)}" step=".5" value="${Math.floor(mn)}" oninput="LS3.lo=+this.value;LS3.mv.add(Math.round(+this.value/2));$('tv').textContent=this.value;l3()"><button class="b s" onclick="LS3.lo=null;l3()">Show all days</button><div id="ro"></div><div id="ins" class="ins"></div>`);l3()}
function l3(){const L=LS3,g=$('lc').getContext('2d'),w=560,h=300,amin=Math.min(...L.A),amax=Math.max(...L.A),dmin=Math.min(...L.D),dmax=Math.max(...L.D),X=a=>40+(a-amin)/(amax-amin)*(w-60),Y=d=>h-30-(d-dmin)/(dmax-dmin)*(h-50);
const idx=L.T.map((t,i)=>i).filter(i=>L.lo==null||(L.T[i]>=L.lo&&L.T[i]<L.lo+3)),st=new Set(idx);g.fillStyle='#0d1232';g.fillRect(0,0,w,h);
L.T.forEach((t,i)=>{g.globalAlpha=st.has(i)?1:.15;g.fillStyle=L.col?`hsl(${220-(t-L.mn)/(L.mx-L.mn)*220},90%,60%)`:'#ffd23f';g.beginPath();g.arc(X(L.A[i]),Y(L.D[i]),5,0,7);g.fill()});g.globalAlpha=1;
g.fillStyle='#9aa6d6';g.font='12px system-ui';g.fillText('More ice cream sold →',w-150,h-8);g.save();g.rotate(-Math.PI/2);g.fillText('More drownings →',-h/2-40,14);g.restore();
const rb=idx.length>=6?cor(idx.map(i=>L.A[i]),idx.map(i=>L.D[i])):null;
$('ro').innerHTML=`All days: r = <b>${L.r.toFixed(2)}</b> · Selected ${idx.length} days: r = <b>${rb==null?'–':rb.toFixed(2)}</b>`;
$('ins').textContent=L.lo==null?'Strong link overall. Does ice cream cause drowning? Colour the days, then look inside one temperature window.':(rb!=null&&Math.abs(rb)<.35?'Among days with the SAME heat the link almost vanishes. Heat is the hidden cause of both!':'Keep sliding to other windows and compare r.');
mis('Slide the temperature window a few times',L.mv.size>=2)}
/* ---------- end screen & playtest evidence ---------- */
function acc(){let c=0,t=0;CON.forEach(k=>{c+=S.res[k].filter(x=>x).length;t+=S.res[k].length});return t?Math.round(100*c/t):0}
function endGame(win){S.mode='end';S.acc=acc();saveHist(win);if(win)$('fbk').style.opacity=0;showEnd(win)}
const o5=d=>[1,2,3,4,5].map(i=>`<option ${i==d?'selected':''}>${i}</option>`).join('');
function logHTML(){const n=LOG.length,av=k=>n?(LOG.reduce((s,x)=>s+x[k],0)/n).toFixed(1):'–';return `<table><tr><th>Playtester</th><th>Understanding before→after</th><th>Quiz %</th><th>Fun</th><th>Feedback</th></tr>${LOG.map(x=>`<tr><td>${x.n}</td><td>${x.b}→${x.a}</td><td>${x.acc}</td><td>${x.f}</td><td>${x.c}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No playtests recorded yet.</td></tr>'}</table><p><b>${n}</b> playtesters · avg understanding ${av('b')} → ${av('a')} (gain <b>${n?(LOG.reduce((s,x)=>s+x.a-x.b,0)/n).toFixed(1):'–'}</b>) · avg quiz ${av('acc')}% · avg fun ${av('f')}/5</p>`}
function showEnd(win){const rs=CON.map(k=>`<li>${k}: <b>${S.res[k].filter(x=>x).length}/${S.res[k].length}</b> correct</li>`).join('');
ov(`<div class="panel">${win?'<span class="fl" style="left:4%;top:6%">🎉</span><span class="fl" style="right:5%;top:8%;animation-delay:1s">🏆</span><span class="fl" style="right:30%;top:4%;animation-delay:.5s">🎊</span>':''}<h1>${win?'🏆 YOU WIN! Every level cleared':'💀 Game over — both lifelines used'}</h1>${win?'<p>Congratulations — you now know overfitting, sampling and correlation vs causation!</p>':'<p>Don’t worry — every wrong answer came with an explanation. Try again!</p>'}<p>Score <b>${S.score}</b> · Coins <b>${S.coins}</b> · Question accuracy <b>${S.acc}%</b></p><ul>${rs}</ul><h3>📋 Playtest evidence</h3><p class="mut">Ask 3–5 peers to play, then record their before/after understanding and feedback (saved in this browser).</p>
<div class="row"><div class="col"><input id="pn" placeholder="Playtester name"><br><br>Understanding BEFORE (1–5) <select id="pb2">${o5(2)}</select><br>Understanding AFTER (1–5) <select id="pa">${o5(4)}</select><br>Fun (1–5) <select id="pf">${o5(4)}</select><br><br><textarea id="pc" rows="3" style="width:100%" placeholder="What did you learn? What was confusing?"></textarea><br><button class="b" onclick="sub()">Save playtest</button></div><div class="col">${logHTML()}</div></div>
<button class="b s" onclick="showHist()">📈 My history</button><button class="b s" onclick="copyRep()">Copy report</button><button class="b" onclick="startGame()">Play again ↺</button></div>`)}
function sub(){const v=id=>$(id).value;LOG.push({n:esc(v('pn')||'Anonymous'),b:+v('pb2'),a:+v('pa'),f:+v('pf'),acc:S.acc||0,c:esc(v('pc'))});try{localStorage.setItem('ddlog',JSON.stringify(LOG))}catch(e){}showEnd()}
function copyRep(){const t='Data Dash playtest report\n'+LOG.map(x=>`${x.n}: understanding ${x.b}→${x.a}, quiz ${x.acc}%, fun ${x.f}/5 — ${x.c}`).join('\n');try{navigator.clipboard.writeText(t);toast('Report copied')}catch(e){toast('Copy not available')}}

<p class="mut" style="margin:0">🎓 Learn data science by running, jumping &amp; playing</p><h1 class="logo">DATA DASH</h1>

<div class="cds"><div class="cd" style="border-color:#f06595"><i>🧠</i><b>Overfitting</b><br>Memorising vs. really understanding.<br><span class="mut">You’ll learn: why a model must be tested on new data.</span></div><div class="cd" style="border-color:#4dabf7"><i>🎲</i><b>Sampling</b><br>Who you ask changes the answer.<br><span class="mut">You’ll learn: random vs. biased samples.</span></div><div class="cd" style="border-color:#51cf66"><i>☀️🍦</i><b>Correlation ≠ Causation</b><br>Moving together isn’t “because”.<br><span class="mut">You’ll learn: spotting a hidden cause.</span></div></div>
